version: 2
updates:
    # SHA-pinned Actions get no Dependabot security alerts, so these monthly
    # version-update PRs are how the pins stay current. Review each bump; this repo
    # has no auto-merge, so every bump is merged by hand.
    - package-ecosystem: 'github-actions'
      directories:
        - '/'
      schedule:
          interval: 'monthly'
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns:
                  - '*'
      labels:
        - 'changelog: none'
        - 'type: dependency'

      # Maintain dependencies for npm
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      # Disable version updates for npm dependencies
      open-pull-requests-limit: 0
      labels:
        - "changelog: none"
        - "type: dependency"
        - "javascript"

      # Maintain dependencies for Composer
    - package-ecosystem: 'composer'
      directory: '/'
      schedule:
          interval: 'weekly'
      # Disable version updates for Composer dependencies
      open-pull-requests-limit: 0
      labels:
        - "changelog: none"
        - "type: dependencies"
        - "php"
