version: 2
updates:
    # SHA-pinned Actions get no Dependabot security alerts, so these monthly
    # version-update PRs keep the pins current. Eligibility for automatic merges
    # is set by .github/workflows/dependabot-auto-merge.yml.
    - package-ecosystem: 'github-actions'
      directories:
        - '/'
      schedule:
          interval: 'monthly'
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns:
                  - '*'
      labels:
        - 'no changelog'
        - 'type: dependency'

      # Maintain dependencies for npm
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      # Disable version updates for npm dependencies
      open-pull-requests-limit: 0
      labels:
        - "no changelog"
        - "type: dependency"
        - "javascript"

      # Maintain dependencies for Composer
    - package-ecosystem: 'composer'
      directory: '/'
      schedule:
          interval: 'weekly'
      # Disable version updates for Composer dependencies
      open-pull-requests-limit: 0
      labels:
        - "no changelog"
        - "type: dependencies"
        - "php"
