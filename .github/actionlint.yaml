# actionlint 1.7.12 predates the vulnerability-alerts permission that GitHub documents at
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
# Remove these entries once https://github.com/rhysd/actionlint/issues/666 is released.
paths:
  .github/workflows/run-audit.yml:
    ignore:
      - 'unknown permission scope "vulnerability-alerts"'
