[files]
extend-exclude = ["languages/", "*.min.js", "*.min.css", "package-lock.json", "composer.lock", "phpstan-baseline.neon", "changelog.txt", "phpcs.baseline", "phpcs*.baseline", "vendor/", "node_modules/", "build/", "assets/dist/"]

[default.extend-words]
# Automattic is the correct spelling of the company name (Automattic Inc.).
Automattic = "Automattic"

[default.extend-identifiers]
# public API: post meta key stored on existing sites (`resouce`).
_wc_booking_resouce_label = "_wc_booking_resouce_label"
# public API: hook name fired by WooCommerce Bookings (`calculte`).
wc_bookings_pre_calculte_booking_cost = "wc_bookings_pre_calculte_booking_cost"
