name: Dependabot auto-merge
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, auto_merge_enabled]
  schedule:
    - cron: '0 9 * * *'
permissions:
  pull-requests: write
  contents: write
  security-events: read
  statuses: write
jobs:
  dependabot-auto-merge:
    uses: Automattic/dependabot-auto-merge-action/.github/workflows/dependabot-auto-merge.yml@0db45d923e00d7e17cc891736f6601a314fea015 # v1.7
    permissions:
      pull-requests: write
      contents: write
      security-events: read
      statuses: write
    with:
      event-name: ${{ github.event_name }}
      age-days: 2
    secrets:
      token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
