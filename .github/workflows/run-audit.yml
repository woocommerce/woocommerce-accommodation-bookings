name: Dependency advisories

on:
  workflow_call:
  schedule:
    # Run at 01:00 on Mondays.
    - cron: '0 1 * * 1'

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Audit npm dependencies
        run: npm run audit:npm

  composer:
    name: Composer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Audit Composer dependencies
        run: npm run audit:composer

  notify:
    name: Notify Slack
    needs: [npm, composer]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      # Skipped until a maintainer adds the SLACK_WEBHOOK_URL secret.
      - if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
        with:
          status: failure
          message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> failed."
