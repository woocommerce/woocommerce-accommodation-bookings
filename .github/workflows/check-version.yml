name: Validate PHP @version Tags

on:
  pull_request:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  version-check:
    name: Validate @version Tag
    # Release bumps replace 'x.x.x' with the real version by design.
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: woocommerce/.github/actions/check-version@c2e5183fbeb0f9fc23e2e974ee7b0a59e6b6b5e0 # trunk @ 2026-11-16
