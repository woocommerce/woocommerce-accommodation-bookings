name: Start Release

# Starts a release: bumps versions on a release/X.Y.Z branch and opens a PR
# against trunk. Run from the Actions UI, or locally with:
#   gh workflow run release-start.yml -f version=X.Y.Z [-f wp_version=A.B] [-f wc_version=C.D]

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z)'
        required: true
        type: string
      wp_version:
        description: 'WP tested up to (X.X) - leave empty for no change'
        required: false
        type: string
        default: ''
      wc_version:
        description: 'WC tested up to (X.X) - leave empty for no change'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: start-release

jobs:

    # Bumps the versions on a new release/X.Y.Z branch and opens the release pull request.
    start:
        name: Start
        uses: woocommerce/.github/.github/workflows/plugin-release-start.yml@11ae4c883ff955b4a4181bac17214e4fd2545547 # shared @ 2026-11-16
        with:
          version: ${{ inputs.version }}
          wp_version: ${{ inputs.wp_version }}
          wc_version: ${{ inputs.wc_version }}
        secrets:
          RELEASE_TOKEN: ${{ secrets.SWW_REVIEW_RELEASE_TOKEN }}
