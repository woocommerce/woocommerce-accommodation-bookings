name: Start Release

# Starts a release: bumps versions on a release/X.Y.Z branch and opens a PR
# against trunk. Run from the Actions UI, or locally with:
#   gh workflow run release-start.yml -f version=X.Y.Z [-f wp_version=A.B] [-f wc_version=C.D]

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z)'
        required: true
        type: string
      wp_version:
        description: 'WP tested up to (X.X) - leave empty for no change'
        required: false
        type: string
        default: ''
      wc_version:
        description: 'WC tested up to (X.X) - leave empty for no change'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:

    start-release:
        name: Create release branch and PR
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
          # Must be a PAT: PRs and pushes made with the default GITHUB_TOKEN
          # do not trigger other workflows (smoke test CI would never run).
          GH_TOKEN: ${{ secrets.RELEASE_CI_TOKEN }}
          VERSION: ${{ inputs.version }}
          WP_VERSION: ${{ inputs.wp_version }}
          WC_VERSION: ${{ inputs.wc_version }}

        steps:

            - name: Checkout trunk
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: trunk
                token: ${{ secrets.RELEASE_CI_TOKEN }}

            - name: Validate inputs
              run: |
                if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Invalid version format '$VERSION'. Expected X.Y.Z."
                  exit 1
                fi
                if [[ -n "$WP_VERSION" && ! "$WP_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Invalid WP version format '$WP_VERSION'. Expected X.X."
                  exit 1
                fi
                if [[ -n "$WC_VERSION" && ! "$WC_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Invalid WC version format '$WC_VERSION'. Expected X.X."
                  exit 1
                fi

            - name: Pre-flight checks
              run: |
                if git ls-remote --exit-code --heads origin "release/${VERSION}" > /dev/null 2>&1; then
                  echo "::error::Branch release/${VERSION} already exists."
                  exit 1
                fi

                # Ignore dotfiles: changelog/.gitkeep keeps the directory in git.
                CHANGE_FILES=$(find changelog -maxdepth 1 -type f ! -name '.*' | wc -l)
                if [[ "$CHANGE_FILES" -eq 0 ]]; then
                  echo "::error::No change files under changelog/. Nothing to release."
                  exit 1
                fi
                echo "Found ${CHANGE_FILES} change file(s) to compile."

            - name: Find GitHub milestone
              id: milestone
              run: |
                MILESTONE_NUMBER=$(gh api "repos/${{ github.repository }}/milestones?per_page=100" --jq ".[] | select(.title == \"${VERSION}\") | .number")
                if [[ -z "$MILESTONE_NUMBER" ]]; then
                  echo "::error::No open milestone titled '${VERSION}' found. Create one at https://github.com/${{ github.repository }}/milestones/new first."
                  exit 1
                fi
                echo "number=$MILESTONE_NUMBER" >> $GITHUB_OUTPUT
                echo "url=https://github.com/${{ github.repository }}/milestone/${MILESTONE_NUMBER}?closed=1" >> $GITHUB_OUTPUT

            - name: Setup node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version-file: .nvmrc

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                php-version: '8.4'
                coverage: none
                tools: composer

            - name: Bump versions
              run: |
                ARGS=( "$VERSION" )
                [[ -n "$WP_VERSION" ]] && ARGS+=( --wp "$WP_VERSION" )
                [[ -n "$WC_VERSION" ]] && ARGS+=( --wc "$WC_VERSION" )
                echo "Running: bash ./bin/update_version.sh ${ARGS[*]}"
                bash ./bin/update_version.sh "${ARGS[@]}"

                # Sync the version field in package-lock.json without a full install.
                npm install --package-lock-only --ignore-scripts

            - name: Compile changelog
              run: |
                composer install --prefer-dist --no-progress --no-ansi --no-interaction

                # The same check the pull request gate runs, over everything the compile
                # is about to consume. A change file can reach trunk without that gate
                # seeing it (a pull request labeled 'no changelog' that adds one anyway),
                # and a malformed one must stop the release rather than land in
                # changelog.txt and break the next parse.
                bash bin/check_changelog.sh --all

                # Compiles changelog/ into changelog.txt under the release version and
                # today's date, then deletes the change files it consumed. Deliberately
                # no --yes: in non-interactive mode that would push past a bad change
                # file instead of stopping the release.
                php vendor/bin/changelogger write --use-version="$VERSION" --no-interaction

                echo "Compiled changelog entries for ${VERSION}:"
                sed -n '3,/^$/p' changelog.txt

            - name: Sync readme.txt changelog
              run: bash bin/sync_readme_changelog.sh "$VERSION"

            - name: Commit and push release branch
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git checkout -b "release/${VERSION}"
                git add -A
                git commit -m "Bump version to ${VERSION}"
                git push origin "release/${VERSION}"

            - name: Create release PR
              id: pr
              run: |
                PR_URL=$(gh pr create \
                  --repo "${{ github.repository }}" \
                  --base trunk \
                  --head "release/${VERSION}" \
                  --title "Release ${VERSION}" \
                  --body "Milestone: ${{ steps.milestone.outputs.url }}")
                echo "url=$PR_URL" >> $GITHUB_OUTPUT
                echo "Release PR: $PR_URL"

            - name: Post changelog vs milestone comparison
              run: |
                CHANGELOG=$(awk -v heading="= ${VERSION} - " 'index($0, heading) == 1 {found=1; next} found && /^= /{exit} found' changelog.txt)
                ISSUES=$(gh api --paginate "repos/${{ github.repository }}/issues?milestone=${{ steps.milestone.outputs.number }}&state=all&per_page=100" --jq '.[] | "- #\(.number) \(.title)"' || echo "(could not fetch milestone issues)")

                gh pr comment "${{ steps.pr.outputs.url }}" --body "$(cat <<EOF
                ### Changelog entries for ${VERSION}

                \`\`\`
                ${CHANGELOG}
                \`\`\`

                ### Milestone issues

                ${ISSUES}

                Every milestone issue should have a matching changelog entry. Compare before approving.
                EOF
                )"

            - name: Summary
              run: |
                echo "Release PR created: ${{ steps.pr.outputs.url }}" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "Next steps:" >> $GITHUB_STEP_SUMMARY
                echo "- Wait for the smoke test CI to pass on the release branch." >> $GITHUB_STEP_SUMMARY
                echo "- Review the changelog vs milestone comparison comment." >> $GITHUB_STEP_SUMMARY
                echo "- Merging the PR into trunk starts the release CI (tag, zip, deploy)." >> $GITHUB_STEP_SUMMARY
                echo "- Trunk is under code freeze until the release PR is merged or closed." >> $GITHUB_STEP_SUMMARY
