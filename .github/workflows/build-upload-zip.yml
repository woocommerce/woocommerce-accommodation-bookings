name: Build and Upload zip

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: acceptance-test-zip
      checkout-ref:
        type: string
    outputs:
      artifact-id:
        description: Production ZIP artifact ID
        value: ${{ jobs.build_project.outputs.artifact-id }}
      source-sha:
        description: Production ZIP source commit
        value: ${{ jobs.build_project.outputs.source-sha }}
      sha256:
        description: SHA-256 of the production ZIP
        value: ${{ jobs.build_project.outputs.sha256 }}
      slug:
        description: Plugin slug from package.json, also the ZIP base name
        value: ${{ jobs.build_project.outputs.slug }}

permissions:
  contents: read

jobs:
  build_project:
        name: Build and upload
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
          source-sha: ${{ steps.identity.outputs.source-sha }}
          sha256: ${{ steps.identity.outputs.sha256 }}
          slug: ${{ steps.identity.outputs.slug }}

        steps:

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ inputs.checkout-ref }}
                persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Setup node version
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: ${{ inputs.checkout-ref == '' && 'pnpm' || '' }}
                  package-manager-cache: ${{ inputs.checkout-ref == '' }}
            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Install PHP dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Build
              env:
                REQUESTED_SHA: ${{ inputs.checkout-ref }}
              run: |
                  if [[ -n "$REQUESTED_SHA" ]]; then
                      test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
                      test -z "$(git status --porcelain --untracked-files=no)"
                  fi
                  pnpm run build:zip

            - name: Identify production ZIP
              id: identity
              run: |
                slug=$(jq -er '.name | strings | select(test("^[a-z0-9]+(-[a-z0-9]+)*$"))' package.json)
                source_sha=$(git rev-parse HEAD)
                checksum=$(sha256sum "deploy/$slug.zip")
                printf 'slug=%s\nsource-sha=%s\nsha256=%s\n' "$slug" "$source_sha" "${checksum%% *}" >> "$GITHUB_OUTPUT"

            - name: Upload zip
              id: upload
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                name: ${{ inputs.artifact-name }}
                path: ${{ github.workspace }}/deploy/${{ steps.identity.outputs.slug }}.zip
                if-no-files-found: error
