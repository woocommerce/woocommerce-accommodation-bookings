name: Build and Upload zip

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build_project:
        name: Build and upload
        runs-on: ubuntu-26.04
        timeout-minutes: 5

        steps:

            - name: Verify Ubuntu 26.04 runner
              shell: bash
              run: |
                . /etc/os-release
                printf "Runner OS: %s %s\n" "$ID" "$VERSION_ID"
                test "$ID" = ubuntu
                test "$VERSION_ID" = 26.04
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node version
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Restore node_modules
              id: cache-node-modules
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              env:
                  cache-name: cache-node-modules-v20260518
              with:
                  path: node_modules
                  key: ubuntu-26.04-${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

            - name: Install Node dependencies
              if: steps.cache-node-modules.outputs.cache-hit != 'true'
              run: npm ci --ignore-scripts

            - name: Build
              run: npm run build:zip

            - name: Upload zip
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                name: acceptance-test-zip
                path: ${{ github.workspace }}/deploy/woocommerce-accommodation-bookings.zip
