name: Release Freeze

# Keep the required check available while the new release workflow rolls out.
# Remove the ruleset requirement before deleting this compatibility workflow.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

    freeze-check:
        name: Check release freeze
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        steps:
            - run: echo "Trunk is open for merges during releases."
