name: Setup NodeJS and Dependencies

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string

permissions:
  contents: read

# Warms the dependency caches that the lint and test jobs restore.
jobs:
  setup-node:
    name: Setup NodeJS and Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Read plugin metadata
        id: config
        run: bash bin/woo-config.sh --github-output

      - name: Set up Node.js and the pnpm store cache
        uses: woocommerce/.github/actions/setup-plugin-env@531bb6e871b08c298de6c093870e83702277f3aa # trunk @ 2026-11-15
        with:
          node: ${{ fromJSON(steps.config.outputs.json).capabilities.js }}
          node-cache: ${{ inputs.checkout-ref == '' }}

      - name: Install Node Dependencies
        if: fromJSON(steps.config.outputs.json).capabilities.js
        run: pnpm install --frozen-lockfile --ignore-scripts

  setup-php:
    name: Setup PHP and Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Set up PHP and the Composer cache
        uses: woocommerce/.github/actions/setup-plugin-env@531bb6e871b08c298de6c093870e83702277f3aa # trunk @ 2026-11-15
        with:
          php-version: '8.4'
          composer-cache: ${{ inputs.checkout-ref == '' }}

      - name: Validate Composer manifest and lockfile
        run: composer validate --no-check-all --no-check-publish

      # --no-scripts: this job only warms the Composer download cache. Install scripts (such as
      # Strauss prefixing) run in the jobs that need their output.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-ansi --no-interaction --optimize-autoloader --no-scripts
