name: PHP Coding Standards

on:
  workflow_call:

jobs:
  phpcs:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Verify Ubuntu 26.04 runner
        shell: bash
        run: |
          . /etc/os-release
          printf "Runner OS: %s %s\n" "$ID" "$VERSION_ID"
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup proper PHP version
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          tools: composer

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ubuntu-26.04-${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ubuntu-26.04-${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer --working-dir=tools/php-quality install --no-interaction --prefer-dist

      - name: Check PHP syntax and new coding-standard findings
        run: composer check:php
