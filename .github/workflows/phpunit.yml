name: PHP Unit Tests

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (plugin header "Requires PHP") and the highest
        # tested one ("PHP tested up to").
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run isolated PHP unit tests
        run: composer test:php -- --log-junit "$RUNNER_TEMP/phpunit-results.xml"
      - name: Run isolated PHP tests
        run: composer test:isolated
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phpunit-results-php${{ matrix.php }}
          path: ${{ runner.temp }}/phpunit-results.xml
          if-no-files-found: ignore
