name: PHP Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (plugin header "Requires PHP") and the highest
        # tested one ("PHP tested up to").
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run isolated PHP unit tests
        run: composer test -- --log-junit "$RUNNER_TEMP/phpunit-results.xml"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-results-php${{ matrix.php }}
          path: ${{ runner.temp }}/phpunit-results.xml
          if-no-files-found: ignore
