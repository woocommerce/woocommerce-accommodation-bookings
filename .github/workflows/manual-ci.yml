# Temporary validation branch; do not merge.
name: Ubuntu 26.04 validation
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ubuntu-26-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  php-lint:
    name: PHP
    uses: ./.github/workflows/phpcs.yml
  js-lint:
    name: JS Linting
    uses: ./.github/workflows/js-lint.yml
  css-lint:
    name: CSS Linting
    uses: ./.github/workflows/css-lint.yml
  php-tests:
    name: PHP
    uses: ./.github/workflows/phpunit.yml
  integration-tests:
    name: Integration tests
    uses: ./.github/workflows/phpunit-integration.yml
    secrets:
      ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}
  e2e-tests:
    name: E2E tests
    uses: ./.github/workflows/e2e.yml
    secrets:
      ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}
  extra-build-upload-zip:
    name: Build and Upload zip
    uses: ./.github/workflows/build-upload-zip.yml
  extra-generate-zip:
    name: Generate ZIP file
    uses: ./.github/workflows/generate-zip.yml
  extra-php-compat:
    name: PHP Compatibility
    uses: ./.github/workflows/php-compat.yml
  extra-phpstan:
    name: PHPStan
    uses: ./.github/workflows/phpstan.yml
  extra-plugin-check:
    name: WordPress Plugin Checks
    uses: ./.github/workflows/plugin-check.yml
  extra-spell-check:
    name: Spell Check
    uses: ./.github/workflows/spell-check.yml
