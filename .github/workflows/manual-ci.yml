name: Test Runner

# Entry point for WooCommerce core's `pnpm run-canonical-extensions-tests`
# (bin/run-canonical-extensions-tests.sh), which dispatches the four inputs below.
on:
  workflow_dispatch:
    inputs:
      wp-version:
        description: 'WordPress version to be tested: `latest`, `rc` (QIT only) or a specific version number.'
        type: string
        default: 'latest'
      wc-version:
        description: 'WooCommerce version to be tested: `latest`, `nightly`, `rc` (QIT only) or a specific version number (e.g. `10.3.0-rc.1`).'
        type: string
        default: 'latest'
      php-version:
        description: 'PHP version. Default is `8.4`.'
        type: string
        default: '8.4'
      qit-tests:
        description: 'QIT Tests'
        type: choice
        default: 'WooCommerce Pre-Release Tests (includes Activation, WooCommerce E2E and API tests)'
        options:
          - 'WooCommerce Pre-Release Tests (includes Activation, WooCommerce E2E and API tests)'
          - 'Weekly default set'
          - 'Activation'
          - 'WooCommerce API'
          - 'WooCommerce E2E'
          - 'Security'
          - 'Malware'
          - 'PHP Compatibility'
          - 'PHPStan'
          - 'Validation'

run-name: Tests with WP-${{ inputs.wp-version }} - WC-${{ inputs.wc-version }} - PHP ${{ inputs.php-version }} - QIT ${{ inputs.qit-tests }}

permissions:
  contents: read

jobs:
  qit-tests:
    name: QIT
    uses: ./.github/workflows/qit.yml
    with:
      test: ${{ fromJSON('{"WooCommerce Pre-Release Tests (includes Activation, WooCommerce E2E and API tests)":"prerelease","Weekly default set":"default","Activation":"activation","WooCommerce API":"api","WooCommerce E2E":"e2e","Security":"security","Malware":"malware","PHP Compatibility":"phpcompat","PHPStan":"phpstan","Validation":"validation"}')[inputs.qit-tests] }}
      # `latest` is QIT's `stable`; every other value (including empty) is passed on unchanged.
      wp-version: ${{ inputs.wp-version == 'latest' && 'stable' || inputs.wp-version }}
      wc-version: ${{ inputs.wc-version == 'latest' && 'stable' || inputs.wc-version }}
      php-version: ${{ inputs.php-version }}
    secrets: inherit

  # WordPress and WooCommerce: `latest` and `stable` run the default version, `rc` skips this job (QIT covers it), and an exact version (e.g. 10.3.0-rc.1) or WooCommerce `nightly` is installed as given. PHP: empty keeps the default versions, anything else replaces them.
  php-integration:
    name: PHP integration tests
    if: ${{ inputs.wp-version != 'rc' && inputs.wc-version != 'rc' }}
    uses: ./.github/workflows/phpunit-integration.yml
    with:
      wp-version: ${{ inputs.wp-version != 'latest' && inputs.wp-version != 'stable' && inputs.wp-version || '' }}
      wc-version: ${{ inputs.wc-version != 'latest' && inputs.wc-version != 'stable' && inputs.wc-version || '' }}
      php-version: ${{ inputs.php-version }}
    secrets:
      ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

  report-run:
    name: Report test selection and outcomes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [qit-tests, php-integration]
    env:
      WP_VERSION: ${{ inputs.wp-version }}
      WC_VERSION: ${{ inputs.wc-version }}
      PHP_VERSION: ${{ inputs.php-version }}
      QIT_TESTS: ${{ inputs.qit-tests }}
      QIT_TESTS_RESULT: ${{ needs.qit-tests.result }}
      PHP_INTEGRATION_RESULT: ${{ needs.php-integration.result }}
    steps:
      - name: Write the test summary
        run: |
          {
            printf '### Requested test environment\n\n'
            printf -- '- Requested WordPress: %s\n' "$WP_VERSION"
            printf -- '- Requested WooCommerce: %s\n' "$WC_VERSION"
            printf -- '- Requested PHP: %s\n' "$PHP_VERSION"
            printf -- '- QIT selection: %s\n' "$QIT_TESTS"
            printf '\n### Job outcomes\n\n'
            printf -- '- QIT: %s\n' "$QIT_TESTS_RESULT"
            printf -- '- PHP integration: %s\n' "$PHP_INTEGRATION_RESULT"
            printf '\nInstalled versions appear in the PHP and browser job logs where available. QIT results use their own environment.\n'
          } >> "$GITHUB_STEP_SUMMARY"
