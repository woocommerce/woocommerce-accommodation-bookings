name: QIT Tests

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Test to run'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - activation
          - api
          - e2e
          - phpstan
          - phpcompat
          - validation
          - security
          - malware
  # Called by manual-ci.yml with the versions requested by WooCommerce core's canonical runner.
  workflow_call:
    inputs:
      test:
        type: string
        default: 'default'
      wp-version:
        type: string
        default: ''
      wc-version:
        type: string
        default: ''
      php-version:
        type: string
        default: ''
  schedule:
    # Run at 02:00 on Tuesdays.
    - cron: '0 2 * * 2'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/generate-zip.yml

  test:
    needs: build
    name: run
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      NO_COLOR: 1
      QIT_DISABLE_ONBOARDING: yes
      EXTENSION: ${{ github.event.repository.name }}
      # Scheduled runs use the default set.
      SELECTED: ${{ inputs.test || 'default' }}
      # Requested versions (empty keeps QIT's defaults); QIT has no `nightly`, only `rc`.
      VERSION_ARGS: >-
        ${{ inputs.wp-version && format('--wordpress_version={0}', inputs.wp-version == 'nightly' && 'rc' || inputs.wp-version) || '' }}
        ${{ inputs.wc-version && format('--woocommerce_version={0}', inputs.wc-version == 'nightly' && 'rc' || inputs.wc-version) || '' }}
        ${{ inputs.php-version && format('--php_version={0}', inputs.php-version) || '' }}

    steps:
      # No checkout: repository code and its Composer config never run alongside the partner secrets.
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}

      - name: Build plugin zip
        run: zip -r "$EXTENSION.zip" "$EXTENSION"

      - name: Set PHP version
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install QIT via composer
        run: composer require 'woocommerce/qit-cli:^1.3'

      - name: Add partner
        id: add-partner
        env:
          PARTNER_USER: ${{ secrets.PARTNER_USER }}
          PARTNER_SECRET: ${{ secrets.PARTNER_SECRET }}
        run: ./vendor/bin/qit partner:add --user="$PARTNER_USER" --application_password="$PARTNER_SECRET"

      # Each selected test runs even if an earlier one failed. Any nonzero QIT
      # exit code, including a warning, fails the run (the shell uses pipefail).
      - name: Run Activation test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'prerelease' || env.SELECTED == 'activation' ) }}
        shell: bash
        run: ./vendor/bin/qit run:activation "$EXTENSION" --zip="$EXTENSION.zip" --plugin=woocommerce-bookings $VERSION_ARGS --wait | tee activation-result.txt

      - name: Run API test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'prerelease' || env.SELECTED == 'api' ) }}
        shell: bash
        run: ./vendor/bin/qit run:woo-api "$EXTENSION" --zip="$EXTENSION.zip" --extension_set=compatibility $VERSION_ARGS --wait | tee api-result.txt

      - name: Run Security test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'security' ) }}
        shell: bash
        run: ./vendor/bin/qit run:security "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee security-result.txt

      - name: Run Malware test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'malware' ) }}
        shell: bash
        run: ./vendor/bin/qit run:malware "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee malware-result.txt

      - name: Run PHPCompat test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'phpcompat' ) }}
        shell: bash
        run: ./vendor/bin/qit run:phpcompatibility "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee phpcompat-result.txt

      - name: Run Validation test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'validation' ) }}
        shell: bash
        run: ./vendor/bin/qit run:validation "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee validation-result.txt

      - name: Run E2E test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'prerelease' || env.SELECTED == 'e2e' ) }}
        shell: bash
        run: ./vendor/bin/qit run:woo-e2e "$EXTENSION" --zip="$EXTENSION.zip" --extension_set=compatibility $VERSION_ARGS --wait | tee e2e-result.txt

      - name: Run PHPStan test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'phpstan' ) }}
        shell: bash
        run: ./vendor/bin/qit run:phpstan "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee phpstan-result.txt

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qit-results
          path: '*-result.txt'
          if-no-files-found: ignore

  notify:
    name: Notify Slack
    needs: [build, test]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      # Skipped until a maintainer adds the SLACK_WEBHOOK_URL secret.
      - if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
        with:
          status: failure
          message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> failed."
