name: QIT Tests

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Test to run'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - activation
          - api
          - e2e
          # QIT PHPStan uses its own config (no repo bootstrap/baseline); the repo's PHPStan (phpstan.yml) is the gate.
          - phpstan
          - phpcompat
          - validation
          - security
          - malware
  # Called by the cron workflows, and by manual-ci.yml with the versions requested by WooCommerce core's canonical runner.
  workflow_call:
    inputs:
      test:
        type: string
        default: 'default'
      wp-version:
        type: string
        default: ''
      wc-version:
        type: string
        default: ''
      php-version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/generate-zip.yml

  test:
    needs: build
    name: run
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      NO_COLOR: 1
      QIT_DISABLE_ONBOARDING: yes
      EXTENSION: ${{ github.event.repository.name }}
      SELECTED: ${{ inputs.test || 'default' }}
      # Requested versions (empty WP/WC keeps QIT's defaults; PHP defaults to 8.4); QIT has no `nightly`, only `rc`.
      VERSION_ARGS: >-
        ${{ inputs.wp-version && format('--wordpress_version={0}', inputs.wp-version == 'nightly' && 'rc' || inputs.wp-version) || '' }}
        ${{ inputs.wc-version && format('--woocommerce_version={0}', inputs.wc-version == 'nightly' && 'rc' || inputs.wc-version) || '' }}
        ${{ format('--php_version={0}', inputs.php-version || '8.4') }}

    steps:
      # No checkout: repository code and its Composer config never run alongside the partner secrets.
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}

      - name: Build plugin zip
        run: zip -r "$EXTENSION.zip" "$EXTENSION"

      - name: Set PHP version
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install QIT via composer
        run: composer require 'woocommerce/qit-cli:1.3.3'

      - name: Add partner
        id: add-partner
        env:
          PARTNER_USER: ${{ secrets.ORG_PARTNER_USER }}
          PARTNER_SECRET: ${{ secrets.ORG_PARTNER_SECRET }}
        run: ./vendor/bin/qit partner:add --user="$PARTNER_USER" --application_password="$PARTNER_SECRET"

      # Each selected test runs even if an earlier one failed. Any nonzero QIT
      # exit code, including a warning, fails the run (the shell uses pipefail).
      - name: Run Activation test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'prerelease' || env.SELECTED == 'activation' || env.SELECTED == 'stable' ) }}
        shell: bash
        run: ./vendor/bin/qit run:activation "$EXTENSION" --zip="$EXTENSION.zip" --plugin=woocommerce-bookings $VERSION_ARGS --wait | tee activation-result.txt

      - name: Run API test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'prerelease' || env.SELECTED == 'api' ) }}
        shell: bash
        run: ./vendor/bin/qit run:woo-api "$EXTENSION" --zip="$EXTENSION.zip" --extension_set=compatibility $VERSION_ARGS --wait | tee api-result.txt

      - name: Run Security test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'security' || env.SELECTED == 'stable' ) }}
        shell: bash
        run: ./vendor/bin/qit run:security "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee security-result.txt

      - name: Run Malware test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'malware' ) }}
        shell: bash
        run: ./vendor/bin/qit run:malware "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee malware-result.txt

      - name: Run PHPCompat test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'phpcompat' || env.SELECTED == 'stable' ) }}
        shell: bash
        run: ./vendor/bin/qit run:phpcompatibility "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee phpcompat-result.txt

      - name: Run Validation test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'validation' || env.SELECTED == 'stable' ) }}
        shell: bash
        run: ./vendor/bin/qit run:validation "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee validation-result.txt

      - name: Run E2E test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'default' || env.SELECTED == 'prerelease' || env.SELECTED == 'e2e' ) }}
        shell: bash
        run: ./vendor/bin/qit run:woo-e2e "$EXTENSION" --zip="$EXTENSION.zip" --extension_set=compatibility $VERSION_ARGS --wait | tee e2e-result.txt

      - name: Run PHPStan test
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' && ( env.SELECTED == 'phpstan' ) }}
        shell: bash
        run: ./vendor/bin/qit run:phpstan "$EXTENSION" --zip="$EXTENSION.zip" --wait | tee phpstan-result.txt

      # Keep each run's server-side record (named failed tests, resolved WP/WC/PHP);
      # the hosted report expires after 7 days. Public repos drop the signed report URLs.
      - name: Retain QIT run records
        if: ${{ !cancelled() && steps.add-partner.outcome == 'success' }}
        shell: bash
        env:
          PUBLIC_REPO: ${{ github.event.repository.private == false }}
        run: |
          for f in *-result.txt; do
            check=${f%-result.txt}
            id=$(grep -m1 -oE 'Test ID: [0-9]+|qit_results=[0-9]+' "$f" | grep -oE '[0-9]+$' | head -n1) || continue
            # `qit get` exits nonzero for a failed run but still prints its record.
            record=$("$GITHUB_WORKSPACE/vendor/bin/qit" get "$id" --json -n) || true
            if [ "$PUBLIC_REPO" = 'true' ]; then
              record=$(jq 'del(.test_results_manager_url, .test_result_aws_url)' <<< "$record") || record=''
            fi
            printf '%s\n' "$record" > "$check.record.json"
          done
          python3 - <<'PYTHON'
          import glob
          import json
          import os

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              records = sorted(glob.glob(os.path.join(os.environ['GITHUB_WORKSPACE'], '*.record.json')))
              if records:
                  summary.write('\n| QIT record | ID | Status | WordPress | WooCommerce | PHP | Failed tests |\n| --- | --- | --- | --- | --- | --- | --- |\n')
              for path in records:
                  try:
                      with open(path) as f:
                          record = json.load(f)
                      cells = [str(record[key]) for key in ('test_run_id', 'status', 'wordpress_version', 'woocommerce_version', 'php_version')]
                  except Exception:
                      # An unreadable record must not change the QIT verdict.
                      record, cells = {}, ['record unavailable', '', '', '', '']
                  try:
                      ctrf = record.get('ctrf_json') or {}
                      tests = ctrf['results']['tests'] if ctrf else []
                      names = [t.get('suite', '') + ' › ' + t.get('name', '') for t in tests if t.get('status') == 'failed']
                  except Exception:
                      # A malformed CTRF report only blanks the failed-test column.
                      names = ['failed-test list unavailable']
                  failed_tests = '<br>'.join(names).replace('|', '\\|') or '-'
                  summary.write('| ' + ' | '.join([os.path.basename(path)[:-len('.record.json')]] + cells + [failed_tests]) + ' |\n')
          PYTHON

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qit-results
          path: |
            *-result.txt
            *.record.json
          if-no-files-found: ignore
