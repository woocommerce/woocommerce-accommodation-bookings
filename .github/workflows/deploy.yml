name: Deploy Product

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.3.7)'
        required: true
        type: string
      node_version:
        description: 'Node.js version (e.g., 20)'
        required: false
        default: '20'
        type: string
      npm_version:
        description: 'npm version (e.g., 10)'
        required: false
        default: '10'
        type: string
      simulate:
        description: 'Run in simulation mode (true for testing, false for production)'
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.3.7)'
        required: true
        type: string
      node_version:
        description: 'Node.js version (e.g., 20)'
        required: false
        default: '20'
        type: string
      npm_version:
        description: 'npm version (e.g., 10)'
        required: false
        default: '10'
        type: string
      simulate:
        description: 'Run in simulation mode (true for testing, false for production)'
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the private action repository
      - name: Checkout woo-product-deploy action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: woocommerce/woo-product-deploy
          ref: trunk
          path: ./.github/actions/woo-product-deploy
          token: ${{ secrets.GITHUB_TOKEN }}  # Need PAT with repo access

      # Use the action we checked out
      - name: Deploy Product
        uses: ./.github/actions/woo-product-deploy
        with:
          repo_url: https://github.com/woocommerce/woocommerce-accommodation-bookings
          branch: trunk
          version: ${{ github.event.inputs.version }}
          node_version: ${{ github.event.inputs.node_version }}
          npm_version: ${{ github.event.inputs.npm_version }}
          simulate: ${{ github.event.inputs.simulate }}
          wporg_release: true
          wccom_release: true
          github_release: true
          deploy_pat: ${{ secrets.GITHUB_TOKEN }}
          wporg_username: ${{ secrets.WPORG_USERNAME }}
          wporg_password: ${{ secrets.WPORG_PASSWORD }}
          partner_user: ${{ secrets.PARTNER_USER }}
          partner_secret: ${{ secrets.PARTNER_SECRET }}
          wccom_product_id: 123456
