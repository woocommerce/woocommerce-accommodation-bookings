name: Deploy Product

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.3.7)'
        required: true
        type: string
      deploy_wordpress:
        description: 'Deploy to WordPress.org'
        required: false
        default: true
        type: boolean
      deploy_github:
        description: 'Deploy to GitHub'
        required: false
        default: true
        type: boolean
      simulate:
        description: 'Dry run mode'
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.3.7)'
        required: true
        type: string
      deploy_wordpress:
        description: 'Deploy to WordPress.org'
        required: false
        default: true
        type: boolean
      deploy_github:
        description: 'Deploy to GitHub'
        required: false
        default: true
        type: boolean
      simulate:
        description: 'Dry run mode'
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Checkout the private action repository
      - name: Checkout woo-product-deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woocommerce/woo-product-deploy
          # Pinned for review. To bump: take `gh api repos/woocommerce/woo-product-deploy/commits/trunk --jq .sha`,
          # review the diff since this SHA, then update the SHA and date.
          ref: c36d132b80747d6a96569712d69937177d7a0274 # trunk @ 2026-09-10
          path: ./.github/actions/woo-product-deploy
          token: ${{ secrets.ORG_DEPLOY_SECRET }}  # Need PAT with access to the action repository

      # Use the action we checked out
      - name: Deploy Product
        uses: ./.github/actions/woo-product-deploy
        with:
          repo_url: https://github.com/woocommerce/woocommerce-accommodation-bookings
          branch: trunk
          version: ${{ github.event.inputs.version }}
          node_version: '24'
          npm_version: '11'
          simulate: ${{ github.event.inputs.simulate }}
          wporg_release: ${{ github.event.inputs.deploy_wordpress }}
          github_release: ${{ github.event.inputs.deploy_github }}
          deploy_pat: ${{ secrets.ORG_DEPLOY_SECRET }}
          wporg_username: ${{ secrets.WPORG_USERNAME }}
          wporg_password: ${{ secrets.WPORG_PASSWORD }}
          partner_user: ${{ secrets.ORG_PARTNER_USER }}
          partner_secret: ${{ secrets.ORG_PARTNER_SECRET }}
          wccom_product_id: 1412069
