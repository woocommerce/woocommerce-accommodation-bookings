name: Publish release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch (release/X.Y.Z)'
        required: true
        type: string

concurrency:
  group: publish-release

permissions:
  contents: read

jobs:

    # Run from trunk: resolves the ready release pull request and pins its commit, runs the checks
    # on it, builds the ZIP once, publishes it to config.woo.release.target and merges the release
    # pull request at the pinned commit.
    publish:
        name: Publish
        permissions:
          actions: read
          checks: read
          contents: write
          issues: write
          pull-requests: read
          statuses: read
        uses: woocommerce/.github/.github/workflows/plugin-release.yml@11ae4c883ff955b4a4181bac17214e4fd2545547 # shared @ 2026-11-16
        with:
          branch: ${{ inputs.branch }}
          slack-channel: '#team-somewherewarm-releases'
        secrets:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}
          ORG_PARTNER_USER: ${{ secrets.ORG_PARTNER_USER }}
          ORG_PARTNER_DEPLOY_SECRET: ${{ secrets.ORG_PARTNER_DEPLOY_SECRET }}
          ORG_DEPLOY_SECRET: ${{ secrets.ORG_DEPLOY_SECRET }}
          WPORG_USERNAME: ${{ secrets.WPORG_USERNAME }}
          WPORG_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          RELEASE_TOKEN: ${{ secrets.SWW_REVIEW_RELEASE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
