name: Release CI

on:
  pull_request:
    types:
      - closed
    branches:
      - trunk

jobs:

    check-versions:
        if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/')
        name: Check versions
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
          release_version: ${{ steps.export.outputs.version }}

        steps:

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Check Versions
              run: |
                bash ./bin/check_versions.sh
                RELEASE_VERSION=$( awk '/Stable tag/ {print}' readme.txt | sed 's/[^0-9.]*\([0-9.]*[-dev]*\).*/\1/' )
                echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV

            - name: Export release version
              id: export
              run: echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

    php-lint:
        name: PHP
        needs: check-versions
        uses: ./.github/workflows/phpcs.yml

    php-unit:
        name: PHP unit tests
        needs: check-versions
        uses: ./.github/workflows/phpunit.yml

    js-lint:
        name: JS Linting
        needs: check-versions
        uses: ./.github/workflows/js-lint.yml

    css-lint:
        name: CSS Linting
        needs: check-versions
        uses: ./.github/workflows/css-lint.yml

    php-tests:
        name: PHP
        needs: [php-lint, php-unit]
        uses: ./.github/workflows/phpunit-integration.yml
        secrets:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

    build_project:
        name: Package
        needs: [php-tests, php-lint, js-lint, css-lint]
        uses: ./.github/workflows/build-upload-zip.yml

    e2e-tests:
        name: E2E tests
        needs: build_project
        uses: ./.github/workflows/e2e.yml
        secrets:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

    release:
        name: Release
        needs: [ e2e-tests, build_project, check-versions ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
          version: ${{ steps.release_identity.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          # head_commit only exists on push events; for pull_request use the merge commit.
          GH_RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_CI_TOKEN: ${{ secrets.RELEASE_CI_TOKEN }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
          RELEASE_ARCHIVE: ${{ github.event.repository.name }}.zip

        steps:

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Download the release artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                name: acceptance-test-zip
                path: .

            - name: Install tools
              run: |
                sudo apt-get install jq
                sudo apt-get install lftp

            - name: Verify release artifact
              id: release_identity
              run: |
                test -n "$RELEASE_VERSION"
                test -s "$RELEASE_ARCHIVE"
                jq -e --arg version "$RELEASE_VERSION" '.version == $version' package.json > /dev/null
                echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

            - name: Release
              run: |
                bash ./bin/release.sh

    deploy:
        name: Deploy
        needs: release
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:

            # Checkout the private action repository
            - name: Checkout woo-product-deploy action
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                repository: woocommerce/woo-product-deploy
                # Pinned for review. To bump: take `gh api repos/woocommerce/woo-product-deploy/commits/trunk --jq .sha`,
                # review the diff since this SHA, then update the SHA and date.
                ref: c36d132b80747d6a96569712d69937177d7a0274 # trunk @ 2026-09-10
                path: ./.github/actions/woo-product-deploy
                token: ${{ secrets.ORG_DEPLOY_SECRET }}  # Need PAT with access to the action repository

            # This plugin ships on WordPress.org, not WooCommerce.com. The release job already
            # created the GitHub release, so the action only deploys to WordPress.org. It builds
            # its own zip from the release merge commit, so the SVN release is not byte for byte
            # the archive the release job verified.
            - name: Deploy to WordPress.org
              uses: ./.github/actions/woo-product-deploy
              with:
                repo_url: https://github.com/${{ github.repository }}
                branch: trunk
                commit: ${{ github.event.pull_request.merge_commit_sha }}
                version: ${{ needs.release.outputs.version }}
                node_version: '24'
                npm_version: '11'
                simulate: 'false'
                wporg_release: 'true'
                github_release: 'false'
                deploy_pat: ${{ secrets.ORG_DEPLOY_SECRET }}
                wporg_username: ${{ secrets.WPORG_USERNAME }}
                wporg_password: ${{ secrets.WPORG_PASSWORD }}

    roll-milestone:
        name: Roll over milestone
        needs: [ deploy, check-versions ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
          issues: write
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}

        steps:

            - name: Close released milestone and create the next one
              run: |
                MILESTONE_NUMBER=$(gh api "repos/${{ github.repository }}/milestones?state=open&per_page=100" \
                  --jq ".[] | select(.title == \"${RELEASE_VERSION}\") | .number")

                if [[ -n "$MILESTONE_NUMBER" ]]; then
                  gh api -X PATCH "repos/${{ github.repository }}/milestones/${MILESTONE_NUMBER}" -f state=closed > /dev/null
                  echo "Closed milestone ${RELEASE_VERSION} (#${MILESTONE_NUMBER})."
                else
                  echo "No open milestone titled '${RELEASE_VERSION}' found, nothing to close."
                fi

                # The next release's type is unknowable at this point, so default
                # to the next patch version; the releaser renames the milestone if
                # the next release turns out to be a minor/major.
                NEXT_VERSION=$(echo "$RELEASE_VERSION" | awk -F. '{print $1"."$2"."($3+1)}')
                # Captured separately so a failed API call aborts the step
                # instead of being masked by grep, and matched literally
                # because version dots are regex metacharacters.
                OPEN_MILESTONES=$(gh api "repos/${{ github.repository }}/milestones?state=open&per_page=100" --jq '.[].title')
                if grep -qxF "$NEXT_VERSION" <<< "$OPEN_MILESTONES"; then
                  echo "Milestone ${NEXT_VERSION} already exists."
                else
                  gh api -X POST "repos/${{ github.repository }}/milestones" -f "title=${NEXT_VERSION}" > /dev/null
                  echo "Created milestone ${NEXT_VERSION}."
                fi

    handle-success:
        if: ${{ success() }}
        needs: [ deploy, check-versions ]
        name: Handle success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
        steps:
          - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
            with:
                status: success
                message: "<{{{workflowUrl}}}|_{{workflow}}_> with run ID <{{workflowRunUrl}}|{{runId}}> for ${{ github.repository }} *v${{ env.RELEASE_VERSION }}* completed."
                channel: '#team-somewherewarm-releases'

    handle-cancelled:
        if: ${{ cancelled() }}
        needs: [ deploy, check-versions ]
        name: Handle cancellation
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
        steps:
          - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
            with:
                status: cancelled
                message: "<{{{workflowUrl}}}|_{{workflow}}_> with run ID <{{workflowRunUrl}}|{{runId}}> for ${{ github.repository }} *v${{ env.RELEASE_VERSION }}* cancelled."
                channel: '#team-somewherewarm-releases'

    handle-error:
        if: ${{ failure() }}
        needs: [ deploy, check-versions ]
        name: Handle failure
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
        steps:
          - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
            with:
                status: failure
                message: "<{{{workflowUrl}}}|_{{workflow}}_> with run ID <{{workflowRunUrl}}|{{runId}}> for ${{ github.repository }} *v${{ env.RELEASE_VERSION }}* failed."
                channel: '#team-somewherewarm-releases'
