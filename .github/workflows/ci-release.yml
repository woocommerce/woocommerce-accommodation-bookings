name: Publish release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch (release/X.Y.Z)'
        required: true
        type: string

concurrency:
  group: publish-release

permissions:
  contents: read

jobs:

    # Release jobs check out a branch SHA without saving dependency caches in trunk.
    check-versions:
        name: Check versions
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
          release_version: ${{ steps.candidate.outputs.version }}
          commit: ${{ steps.candidate.outputs.commit }}
          pull-request: ${{ steps.candidate.outputs.pull-request }}

        permissions:
          actions: read
          checks: read
          contents: read
          pull-requests: read
          statuses: read
        steps:

            - name: Resolve release PR and commit
              id: candidate
              env:
                GH_TOKEN: ${{ github.token }}
                RELEASE_BRANCH: ${{ inputs.branch }}
              run: |
                if [[ "$GITHUB_REF" != refs/heads/trunk || ! "$RELEASE_BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Run this workflow from trunk with a release/X.Y.Z branch."
                  exit 1
                fi

                pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
                  -f state=open -f base=trunk -f "head=${GITHUB_REPOSITORY_OWNER}:$RELEASE_BRANCH" |
                  jq -e --arg repo "$GITHUB_REPOSITORY" --arg ref "$RELEASE_BRANCH" \
                    '[.[] | select(.head.repo.full_name == $repo and .head.ref == $ref and .draft == false)] |
                     if length == 1 then .[0] else error("Expected one open release PR") end')
                sha=$(jq -er '.head.sha | select(test("^[a-f0-9]{40}$"))' <<< "$pr")
                pr_number=$(jq -er .number <<< "$pr")
                gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --required
                for attempt in 1 2 3; do
                  state=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid,mergeStateStatus,reviewDecision)
                  if [[ $(jq -r .mergeStateStatus <<< "$state") != UNKNOWN || "$attempt" == 3 ]]; then
                    break
                  fi
                  sleep 3
                done
                jq -e --arg sha "$sha" '
                  .headRefOid == $sha and
                  (.mergeStateStatus == "CLEAN" or .mergeStateStatus == "UNSTABLE") and
                  (.reviewDecision == "" or .reviewDecision == "APPROVED")
                ' <<< "$state" > /dev/null ||
                  { echo "::error::The release PR head must match and meet the trunk merge requirements."; exit 1; }

                for (( attempt=1; attempt<GITHUB_RUN_ATTEMPT; attempt++ )); do
                  original=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100" \
                    --jq '.jobs[] | select(.name == "Check versions") | .conclusion')
                  if [[ "$original" == success ]]; then
                    echo "::error::Re-run failed jobs from the attempt that pinned the release commit and ZIP."
                    exit 1
                  fi
                done
                {
                  echo "commit=$sha"
                  echo "pull-request=$pr_number"
                  echo "version=${RELEASE_BRANCH#release/}"
                } >> "$GITHUB_OUTPUT"
                echo "Publishing \`$RELEASE_BRANCH\` at \`$sha\`." >> "$GITHUB_STEP_SUMMARY"

            - name: Checkout version checking tools
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Checkout release commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ steps.candidate.outputs.commit }}
                path: release-candidate
                persist-credentials: false

            - name: Check versions
              working-directory: release-candidate
              env:
                RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
              run: |
                bash ../bin/check_versions.sh
                jq -e --arg version "$RELEASE_VERSION" '.version == $version' package.json > /dev/null

    build_project:
        name: Package
        needs: check-versions
        uses: ./.github/workflows/build-upload-zip.yml
        with:
          checkout-ref: ${{ needs.check-versions.outputs.commit }}

    check-release-archive:
        name: Check release archive
        needs: build_project
        uses: ./.github/workflows/plugin-check.yml
        with:
          release-artifact: acceptance-test-zip

    php-tests:
        name: PHP
        needs: check-versions
        uses: ./.github/workflows/phpunit.yml
        with:
          checkout-ref: ${{ needs.check-versions.outputs.commit }}

    release:
        name: Release
        needs: [ check-release-archive, php-tests, build_project, check-versions ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
          contents: write
        outputs:
          artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}
          sha256: ${{ steps.release_identity.outputs.sha256 }}
          version: ${{ steps.release_identity.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_COMMIT: ${{ needs.check-versions.outputs.commit }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
          RELEASE_ARCHIVE: ${{ github.event.repository.name }}.zip

        steps:

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ needs.check-versions.outputs.commit }}
                persist-credentials: false

            - name: Checkout release tooling
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                path: release-tooling
                persist-credentials: false

            - name: Download the release artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                name: acceptance-test-zip
                path: .

            - name: Install tools
              run: |
                sudo apt-get install jq

            - name: Verify release artifact
              id: release_identity
              run: |
                test -n "$RELEASE_VERSION"
                test -s "$RELEASE_ARCHIVE"
                jq -e --arg version "$RELEASE_VERSION" '.version == $version' package.json > /dev/null
                RELEASE_SHA256=$(sha256sum "$RELEASE_ARCHIVE")
                echo "sha256=${RELEASE_SHA256%% *}" >> "$GITHUB_OUTPUT"
                echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

            - name: Preserve the release archive for deployment
              id: release_artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                name: release-zip-${{ github.run_attempt }}
                path: ${{ env.RELEASE_ARCHIVE }}
                if-no-files-found: error

            - name: Release
              run: |
                bash ./release-tooling/bin/release.sh

    # Deploys the archive released above to WordPress.org, under the plugin slug that
    # package.json's config.wp_org_slug names.
    deploy:
        name: Deploy
        needs: [release, check-versions]
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
          RELEASE_ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA256: ${{ needs.release.outputs.sha256 }}

        steps:

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ needs.check-versions.outputs.commit }}
                persist-credentials: false

            - name: Check release artifact identity
              run: |
                if [[ ! "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
                  echo "A single release artifact ID is required."
                  exit 1
                fi

            - name: Download the released archive
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                artifact-ids: ${{ env.RELEASE_ARTIFACT_ID }}
                path: .

            - name: Checkout the woo-product-deploy action
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                repository: woocommerce/woo-product-deploy
                # Pinned for review. To bump: take `gh api repos/woocommerce/woo-product-deploy/commits/trunk --jq .sha`,
                # review the diff since this SHA, then update the SHA and date.
                ref: 0ef871021cdf6c4183a6b0470ee6a7be844d748a # trunk @ 2026-10-02
                path: ./.github/actions/woo-product-deploy
                token: ${{ secrets.ORG_DEPLOY_SECRET }}
                persist-credentials: false

            # The action pushes the archive released above to WordPress.org as is: it checks the
            # checksum and the Version header, and does not rebuild. The GitHub release already exists.
            - name: Deploy to WordPress.org
              uses: ./.github/actions/woo-product-deploy
              with:
                repo_url: https://github.com/${{ github.repository }}
                branch: ${{ inputs.branch }}
                commit: ${{ needs.check-versions.outputs.commit }}
                version: ${{ env.RELEASE_VERSION }}
                zip: ${{ github.event.repository.name }}.zip
                zip_sha256: ${{ env.RELEASE_SHA256 }}
                node_version: '24'
                npm_version: '11'
                simulate: false
                wporg_release: true
                github_release: false
                deploy_pat: ${{ secrets.ORG_DEPLOY_SECRET }}
                wporg_username: ${{ secrets.WPORG_USERNAME }}
                wporg_password: ${{ secrets.WPORG_PASSWORD }}

    merge-release:
        name: Merge shipped release
        needs: [deploy, check-versions]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
          GH_TOKEN: ${{ secrets.SWW_REVIEW_RELEASE_TOKEN }}
          RELEASE_PR: ${{ needs.check-versions.outputs.pull-request }}
          RELEASE_COMMIT: ${{ needs.check-versions.outputs.commit }}

        steps:

            - name: Merge release PR
              run: |
                pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$RELEASE_PR"
                if ! gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR/merge" \
                  -f "sha=$RELEASE_COMMIT" -f merge_method=merge | jq -e '.merged == true' &&
                  ! gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" | jq -e --arg sha "$RELEASE_COMMIT" '.merged and .head.sha == $sha'; then
                  echo "::error::Deployed, merge pending. See $pr_url. Re-run failed jobs after checks pass, or finish through the PR if its head changed."
                  echo "Deployed, merge pending. Review $pr_url." >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi

    roll-milestone:
        name: Roll over milestone
        needs: [ deploy, check-versions ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
          issues: write
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}

        steps:

            - name: Close released milestone
              run: |
                MILESTONE_NUMBER=$(gh api --paginate "repos/${{ github.repository }}/milestones?state=open&per_page=100" \
                  --jq ".[] | select(.title == \"${RELEASE_VERSION}\") | .number")

                if [[ -n "$MILESTONE_NUMBER" ]]; then
                  gh api -X PATCH "repos/${{ github.repository }}/milestones/${MILESTONE_NUMBER}" -f state=closed > /dev/null
                  echo "Closed milestone ${RELEASE_VERSION} (#${MILESTONE_NUMBER})."
                else
                  echo "No open milestone titled '${RELEASE_VERSION}' found, nothing to close."
                fi

    handle-success:
        if: ${{ success() }}
        needs: [ deploy, merge-release, check-versions ]
        name: Handle success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
        steps:
          - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
            with:
                status: success
                message: "<{{{workflowUrl}}}|_{{workflow}}_> with run ID <{{workflowRunUrl}}|{{runId}}> for ${{ github.repository }} *v${{ env.RELEASE_VERSION }}* completed."
                channel: '#team-somewherewarm-releases'

    handle-cancelled:
        if: ${{ cancelled() && needs.check-versions.outputs.release_version != '' }}
        needs: [ deploy, merge-release, check-versions ]
        name: Handle cancellation
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
        steps:
          - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
            with:
                status: cancelled
                message: "<{{{workflowUrl}}}|_{{workflow}}_> with run ID <{{workflowRunUrl}}|{{runId}}> for ${{ github.repository }} *v${{ env.RELEASE_VERSION }}* cancelled."
                channel: '#team-somewherewarm-releases'

    handle-error:
        if: ${{ failure() && needs.check-versions.outputs.release_version != '' }}
        needs: [ deploy, merge-release, check-versions ]
        name: Handle failure
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.check-versions.outputs.release_version }}
        steps:
          - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
            with:
                status: failure
                message: "<{{{workflowUrl}}}|_{{workflow}}_> with run ID <{{workflowRunUrl}}|{{runId}}> for ${{ github.repository }} *v${{ env.RELEASE_VERSION }}* failed."
                channel: '#team-somewherewarm-releases'
