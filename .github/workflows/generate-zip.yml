name: Generate ZIP file

on:
  workflow_dispatch:
  workflow_call:

jobs:
    generate-zip-file:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Setup Node.js and pnpm store cache
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'
            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Install PHP dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Install WP-CLI
              run: |
                  mkdir -p tools
                  curl --fail --location --proto '=https' --tlsv1.2 \
                    https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar \
                    --output tools/wp
                  echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  tools/wp' | sha256sum --check -
                  chmod +x tools/wp
                  echo "$PWD/tools" >> "$GITHUB_PATH"

            - name: Generate ZIP file
              run: pnpm run build:zip && rm -rf ./woocommerce-accommodation-bookings && unzip deploy/woocommerce-accommodation-bookings.zip -d ./woocommerce-accommodation-bookings

            - name: Use the Upload Artifact GitHub Action
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: woocommerce-accommodation-bookings
                  path: woocommerce-accommodation-bookings/
