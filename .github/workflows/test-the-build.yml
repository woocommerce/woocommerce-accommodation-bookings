name: Test the build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: woocommerce/.github/.github/workflows/plugin-test-the-build.yml@203f4ce0cd601a0bafeda90b8975666b05cc0584 # shared @ 2026-11-17
    with:
      plugin-slug: woocommerce-accommodation-bookings
      playground-files: |
        tests/playground/preview.php
        tests/playground/setup.php
