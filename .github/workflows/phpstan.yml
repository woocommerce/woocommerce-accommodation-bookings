name: PHPStan

on:
  workflow_call:
    secrets:
      # Reads the private woocommerce/all-plugins repository for tools/php-stubs.
      ORG_DOWNLOADS:
        required: false

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Install integration stubs
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.ORG_DOWNLOADS }}"}}'
          # Outside the cached directory: the private stubs archive must never reach actions/cache.
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/php-stubs-cache
        run: composer install --prefer-dist --no-scripts --no-progress --no-interaction --working-dir=tools/php-stubs
      - run: composer lint:phpstan
