name: PHP Coding Standards

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string

permissions:
  contents: read

jobs:

  config:
    name: Read plugin metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.config.outputs.json }}
    steps:
      - name: Read config.woo
        id: config
        uses: woocommerce/.github/actions/read-plugin-config@531bb6e871b08c298de6c093870e83702277f3aa # trunk @ 2026-11-15
        with:
          ref: ${{ inputs.checkout-ref }}

  # One job per PHP version in config.woo.phpLint.php.
  php-coding-standards:
    name: Coding standards (PHP ${{ matrix.php }})
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.config.outputs.json).phpLint.php }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
          # SARB baselines and phpcs-changed compare against the base branch.
          fetch-depth: 0

      - name: Set up PHP and the Composer cache
        uses: woocommerce/.github/actions/setup-plugin-env@531bb6e871b08c298de6c093870e83702277f3aa # trunk @ 2026-11-15
        with:
          php-version: ${{ matrix.php }}
          php-tools: composer, wp-cli
          composer-cache: ${{ inputs.checkout-ref == '' }}

      - name: Validate Composer manifest and lockfile
        run: composer validate --no-check-all --no-check-publish

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-ansi --no-interaction --optimize-autoloader
          echo "${PWD}/vendor/bin" >> "$GITHUB_PATH"

      - name: Log debug information
        run: |
          php --version
          composer --version

      # The repository's PHP gate: syntax, PHPCS (baseline or changed lines) and any compatibility checks.
      - name: Run PHP checks
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: composer check:php

      - name: Run repository PHP checks
        if: hashFiles('bin/hooks/php-lint.sh') != ''
        run: bash bin/hooks/php-lint.sh

  # One job per PHP version in config.woo.phpLint.isolatedPhp.
  php-isolated-tests:
    name: Isolated tests (PHP ${{ matrix.php }})
    needs: config
    if: fromJSON(needs.config.outputs.json).capabilities.isolated
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.config.outputs.json).phpLint.isolatedPhp }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Set up PHP and the Composer cache
        uses: woocommerce/.github/actions/setup-plugin-env@531bb6e871b08c298de6c093870e83702277f3aa # trunk @ 2026-11-15
        with:
          php-version: ${{ matrix.php }}
          composer-cache: ${{ inputs.checkout-ref == '' }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-ansi --no-interaction --optimize-autoloader

      - name: Run isolated PHP tests
        run: composer run test:php:isolated
