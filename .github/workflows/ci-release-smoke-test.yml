name: Release Smoke Test CI

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:

    # The versions in the plugin files, PHP lint and JavaScript lint on the release branch.
    smoke:
        name: Smoke test
        uses: woocommerce/.github/.github/workflows/plugin-release-smoke-test.yml@8e51301f6233ede06d23b3a4d7bf1816a833ada7 # shared @ 2026-11-18
        with:
          slack-channel: '#team-somewherewarm-releases'
        secrets:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
