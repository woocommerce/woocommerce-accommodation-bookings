name: Release Smoke Test CI

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:

    # The versions in the plugin files, PHP lint and JavaScript lint on the release branch.
    smoke:
        name: Smoke test
        permissions:
          contents: read
          checks: write
          pull-requests: read
        uses: woocommerce/.github/.github/workflows/plugin-release-smoke-test.yml@4abad420d9818a172e1cd4207adf64a67a525852 # trunk @ 2026-11-15
        with:
          slack-channel: '#team-somewherewarm-releases'
        secrets:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
