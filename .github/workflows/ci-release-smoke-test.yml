name: Release Smoke Test CI

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:

    # The versions in the plugin files, PHP lint and JavaScript lint on the release branch.
    smoke:
        name: Smoke test
        uses: woocommerce/.github/.github/workflows/plugin-release-smoke-test.yml@c2e5183fbeb0f9fc23e2e974ee7b0a59e6b6b5e0 # trunk @ 2026-11-16
        with:
          slack-channel: '#team-somewherewarm-releases'
        secrets:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
