name: Release Smoke Test CI

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:

    # The versions in the plugin files, PHP lint and JavaScript lint on the release branch.
    smoke:
        name: Smoke test
        uses: woocommerce/.github/.github/workflows/plugin-release-smoke-test.yml@98ba1eea58b2c918bfc29f91a848090526b993ce # trunk @ 2026-11-16
        with:
          slack-channel: '#team-somewherewarm-releases'
        secrets:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
