name: Release Smoke Test CI

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:

    # The versions in the plugin files, PHP lint and JavaScript lint on the release branch.
    smoke:
        name: Smoke test
        uses: woocommerce/.github/.github/workflows/plugin-release-smoke-test.yml@e08449c1714a8e133134812f32f3dfe412d4fb6a # shared @ 2026-11-16
        with:
          slack-channel: '#team-somewherewarm-releases'
        secrets:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
