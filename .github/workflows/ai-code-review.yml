name: AI Code Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

# The shared workflow's review job needs these; it reviews same-repository pull requests only
# and rejects pull requests from forks.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # The shared workflow still validates the exact review command and permissions.
    if: >-
      github.repository_owner == 'woocommerce' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request != null && github.event.issue.state == 'open' &&
        contains(github.event.comment.body, '@claude') && contains(github.event.comment.body, 'review')))
    # Comment runs get their own group until the shared guard validates the command.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number || github.run_id }}-${{ github.event_name }}
      cancel-in-progress: true
    # Pinned for review. To bump: take `gh api repos/woocommerce/.github/commits/trunk --jq .sha`,
    # review the ai-code-review.yml diff since this SHA, then update the SHA and date.
    uses: woocommerce/.github/.github/workflows/ai-code-review.yml@12e5645b1a032fe1bee29bb387b61fa7a9817553 # shared @ 2026-11-17
    secrets:
      AI_CODE_REVIEW_ANTHROPIC_API_KEY: ${{ secrets.AI_CODE_REVIEW_ANTHROPIC_API_KEY }}
      AI_REVIEW_TELEMETRY_TOKEN: ${{ secrets.AI_REVIEW_TELEMETRY_TOKEN }}
      AI_REVIEW_SLACK_WEBHOOK_URL: ${{ secrets.AI_REVIEW_SLACK_WEBHOOK_URL }}
