name: E2E test

on:
  workflow_dispatch:
  push:
    branches:
      - smoke-testing
  workflow_call:
    secrets:
      ORG_DOWNLOADS:
        required: false

jobs:
  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Runs before checkout so no pull-request code or dependency can observe the token.
      - name: Download WooCommerce Bookings
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::The ORG_DOWNLOADS secret isn't available to this run (fork and Dependabot PRs don't receive it), so WooCommerce Bookings can't be downloaded."
            exit 1
          fi
          gh release download --repo woocommerce/woocommerce-bookings --pattern woocommerce-bookings.zip --dir "$RUNNER_TEMP"
        env:
          GH_TOKEN: ${{ secrets.ORG_DOWNLOADS }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Node cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ~/.npm
          key: node-${{ hashFiles('package-lock.json') }}

      - name: Node install
        run: npm ci

      - name: Build
        run: npm run prebuild && npm run build:webpack && npm run archive

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Stage WooCommerce Bookings
        run: mv "$RUNNER_TEMP/woocommerce-bookings.zip" .

      - name: Setup WP environment
        run: npm run env:start

      - name: Run E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          # Keep the Playwright login state (storageState files) out of the artifact.
          path: |
            tests/e2e/test-results/
            !tests/e2e/test-results/storage*
          retention-days: 2
