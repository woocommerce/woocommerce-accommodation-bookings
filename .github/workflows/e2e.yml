name: E2E test

on:
  workflow_dispatch:
  push:
    branches:
      - smoke-testing

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Package
    uses: ./.github/workflows/build-upload-zip.yml
    with:
      checkout-ref: ${{ github.sha }}

  e2e:
    name: E2E test
    needs: package
    uses: ./.github/workflows/run-e2e.yml
    with:
      artifact-id: ${{ needs.package.outputs.artifact-id }}
      source-sha: ${{ needs.package.outputs.source-sha }}
      sha256: ${{ needs.package.outputs.sha256 }}
      checkout-ref: ${{ github.sha }}
    secrets:
      ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}
