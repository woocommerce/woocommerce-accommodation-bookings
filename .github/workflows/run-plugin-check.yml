name: 'WordPress Plugin Checks'

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      expected-source-sha:
        type: string
        required: true
      sha256:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  # config.woo.pluginCheck of the candidate's commit.
  config:
    name: Read plugin metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      json: ${{ steps.config.outputs.json }}
    steps:
      - name: Read config.woo
        id: config
        uses: woocommerce/.github/actions/read-plugin-config@531bb6e871b08c298de6c093870e83702277f3aa # trunk @ 2026-11-15
        with:
          ref: ${{ inputs.source-sha }}

  test:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.json).pluginCheck.timeoutMinutes }}
    steps:
      # Pinned for review. To bump: take `gh api repos/woocommerce/.github/commits/trunk --jq .sha`,
      # review the verify-candidate-zip diff since this SHA, then update the SHA and date.
      - name: Verify and unpack the production ZIP
        id: candidate
        uses: woocommerce/.github/actions/verify-candidate-zip@b8284427f0dece122f22ff8170f83dd23120281f # trunk @ 2026-11-15
        with:
          artifact-id: ${{ inputs.artifact-id }}
          source-sha: ${{ inputs.source-sha }}
          expected-source-sha: ${{ inputs.expected-source-sha }}
          sha256: ${{ inputs.sha256 }}
          zip-name: ${{ fromJSON(needs.config.outputs.json).slug }}.zip
          destination: release-build
          root: ${{ fromJSON(needs.config.outputs.json).zip.root }}
          main-file: ${{ fromJSON(needs.config.outputs.json).mainFile }}

      - name: Run plugin check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ steps.candidate.outputs.plugin-dir }}
          repo-token: ''
          exclude-checks: ${{ join(fromJSON(needs.config.outputs.json).pluginCheck.excludeChecks, fromJSON('"\n"')) }}
          exclude-directories: ${{ join(fromJSON(needs.config.outputs.json).pluginCheck.excludeDirectories, fromJSON('"\n"')) }}
          exclude-files: ${{ join(fromJSON(needs.config.outputs.json).pluginCheck.excludeFiles, fromJSON('"\n"')) }}
          ignore-warnings: ${{ fromJSON(needs.config.outputs.json).pluginCheck.ignoreWarnings }}
          strict: ${{ fromJSON(needs.config.outputs.json).pluginCheck.strict }}
          # Plugin Check has no baseline support: config.woo.pluginCheck.ignoreCodes lists legacy
          # codes with pre-existing hits that the repository's own PHPCS gate tracks.
          ignore-codes: ${{ join(fromJSON(needs.config.outputs.json).pluginCheck.ignoreCodes, fromJSON('"\n"')) }}
