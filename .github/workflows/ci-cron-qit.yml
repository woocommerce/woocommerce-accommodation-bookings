name: Cron QIT

on:
    schedule:
        # Run at 02:00 on Wednesdays.
        - cron: '0 2 * * 3'

permissions:
    contents: read

jobs:

    qit-tests:
        name: QIT
        uses: ./.github/workflows/qit.yml
        secrets: inherit
        with:
          test: 'default'
          wp-version: 'nightly'
          wc-version: 'nightly'

    handle-success:
        if: ${{ success() }}
        needs: qit-tests
        name: Handle success
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
            - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
              with:
                  status: success
                  message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> passed."

    handle-cancelled:
        if: ${{ cancelled() }}
        needs: qit-tests
        name: Handle cancellation
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        steps:
            - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
              with:
                  status: cancelled
                  message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> cancelled."

    handle-error:
      if: ${{ failure() }}
      needs: qit-tests
      name: Handle failure
      runs-on: ubuntu-latest
      timeout-minutes: 5
      env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      steps:
          - uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2
            with:
                status: failure
                message: "Scheduled workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> failed. You can find the results in the artifacts section."
