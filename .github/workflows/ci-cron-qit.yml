name: Cron QIT

on:
  schedule:
    # Run at 02:00 on Wednesdays.
    - cron: '0 2 * * 3'
  # The same run on demand, for example to check a workflow change on its branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:

    # The full set of QIT tests on the WordPress and WooCommerce release candidates. Plugins
    # without config.woo.capabilities.qit skip it.
    qit:
        name: QIT
        uses: woocommerce/.github/.github/workflows/plugin-cron-qit.yml@75d9ac309f32345d4560a75b8681058e479d7b63 # shared @ 2026-11-25
        with:
          slack-channel: '#team-somewherewarm-ci'
        secrets:
          ORG_PARTNER_USER: ${{ secrets.ORG_PARTNER_USER }}
          ORG_PARTNER_SECRET: ${{ secrets.ORG_PARTNER_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
