name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Detect which kinds of files changed so each check runs only when its
  # inputs change. A workflow change counts as every kind of change, so CI
  # edits exercise the whole pipeline.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      php: ${{ steps.categories.outputs.php == 'true' || steps.categories.outputs.workflows == 'true' }}
      frontend: ${{ steps.categories.outputs.frontend == 'true' || steps.categories.outputs.workflows == 'true' }}
      docs: ${{ steps.categories.outputs.docs == 'true' || steps.categories.outputs.workflows == 'true' }}
      product: ${{ steps.product.outputs.product == 'true' || steps.categories.outputs.workflows == 'true' }}
      workflows: ${{ steps.categories.outputs.workflows }}
      deps: ${{ steps.categories.outputs.deps == 'true' || steps.categories.outputs.workflows == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: categories
        with:
          filters: |
            php:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - 'phpcs*.xml*'
              - 'phpcs.baseline'
              - 'phpstan*.neon*'
              - 'phpunit.xml*'
              - 'phpunit-integration.xml'
              - 'tests/bin/*.sh'
              - 'bin/php*.sh'
              - 'tools/php-quality/**'
            frontend:
              - '**/*.{js,jsx,ts,tsx,mjs,cjs,scss,css}'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.stylelintrc.json'
              - '.npmpackagejsonlintrc.json'
            docs:
              - '**/*.md'
              - '.markdownlint*'
              - 'package.json'
              - 'package-lock.json'
            workflows:
              - '.github/**'
            deps:
              - 'package.json'
              - 'package-lock.json'
              - '**/composer.json'
              - '**/composer.lock'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: product
        with:
          # A file must satisfy EVERY pattern below to count as a product
          # change. Without this the action ORs them ('some', the default),
          # so '**' matches on its own and every '!' negation is dead code.
          predicate-quantifier: 'every'
          filters: |
            product:
              # Anything that can affect the build or browser behavior:
              # everything except unit and integration tests, docs, and
              # tooling config.
              - '**'
              - '!tests/phpunit/**'
              - '!tests/integration/**'
              - '!tests/bin/**'
              - '!phpunit.xml'
              - '!phpunit-integration.xml'
              - '!**/*.md'
              - '!.markdownlintignore'
              - '!changelog.txt'
              - '!readme.txt'
              - '!.coderabbit.yaml'

  spelling:
    name: Spelling
    uses: ./.github/workflows/spell-check.yml

  phpcs:
    name: PHPCS
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    uses: ./.github/workflows/phpcs.yml

  phpstan:
    name: PHPStan
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    uses: ./.github/workflows/phpstan.yml

  php-compatibility:
    name: PHP compatibility
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    uses: ./.github/workflows/php-compat.yml

  css:
    name: CSS
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/css-lint.yml

  javascript:
    name: JavaScript and Markdown
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docs == 'true' }}
    uses: ./.github/workflows/js-lint.yml
    with:
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      docs: ${{ needs.changes.outputs.docs == 'true' }}

  actionlint:
    name: Workflow lint
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install actionlint 1.7.12
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint

      # Embedded shell and Python snippets are not linted.
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes='

  # High and critical advisories also fail the weekly scheduled run.
  audit:
    name: Dependency advisories
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    uses: ./.github/workflows/run-audit.yml

  # The jobs below run only for ready-for-review PRs.

  php-unit:
    name: PHP unit tests
    needs: changes
    if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.php == 'true' }}
    uses: ./.github/workflows/phpunit.yml

  # Needs the licensed Bookings and Product Add-Ons downloads, so fork PRs skip
  # it like E2E below.
  php-integration:
    name: PHP integration tests
    needs: changes
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.php == 'true' }}
    uses: ./.github/workflows/phpunit-integration.yml
    secrets:
      ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

  plugin-check:
    name: Plugin Check
    needs: changes
    if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.product == 'true' }}
    uses: ./.github/workflows/plugin-check.yml

  # Builds the production ZIP with the release command and keeps it as an artifact for review and manual testing.
  package:
    name: Package
    needs: changes
    if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.product == 'true' }}
    uses: ./.github/workflows/generate-zip.yml

  # The tests need WooCommerce Bookings, a private download. Fork PRs never
  # receive the secret, so E2E is skipped for them. Dependabot PRs still run it
  # and need ORG_DOWNLOADS as a Dependabot secret.
  e2e:
    name: E2E
    needs: changes
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.product == 'true' }}
    uses: ./.github/workflows/e2e.yml
    secrets:
      ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}

  # The single status that branch protection requires. It fails when any
  # applicable check failed, was cancelled, is missing or was skipped
  # unexpectedly, and always fails on drafts so a draft-era result can never
  # satisfy branch protection once the PR is ready for review.
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [changes, spelling, phpcs, phpstan, php-compatibility, css, javascript, actionlint, audit, php-unit, php-integration, plugin-check, package, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      CI_DRAFT: ${{ github.event.pull_request.draft }}
      CI_RESULTS: ${{ toJSON(needs) }}
      CI_EXPECTED: >-
        {
          "changes": true,
          "spelling": true,
          "phpcs": ${{ needs.changes.outputs.php == 'true' }},
          "phpstan": ${{ needs.changes.outputs.php == 'true' }},
          "php-compatibility": ${{ needs.changes.outputs.php == 'true' }},
          "css": ${{ needs.changes.outputs.frontend == 'true' }},
          "javascript": ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docs == 'true' }},
          "actionlint": ${{ needs.changes.outputs.workflows == 'true' }},
          "audit": ${{ needs.changes.outputs.deps == 'true' }},
          "php-unit": ${{ github.event.pull_request.draft == false && needs.changes.outputs.php == 'true' }},
          "php-integration": ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.php == 'true' }},
          "plugin-check": ${{ github.event.pull_request.draft == false && needs.changes.outputs.product == 'true' }},
          "package": ${{ github.event.pull_request.draft == false && needs.changes.outputs.product == 'true' }},
          "e2e": ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.product == 'true' }}
        }
      # Checks that need a private download and are skipped for fork PRs; reviewers must run them from a branch here.
      CI_FORK_SKIPPED: >-
        {
          "php-integration": ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name != github.repository && needs.changes.outputs.php == 'true' }},
          "e2e": ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name != github.repository && needs.changes.outputs.product == 'true' }}
        }
    steps:
      - name: Check required results
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.CI_RESULTS);
          const expected = JSON.parse(process.env.CI_EXPECTED);
          let failed = false;
          for (const job of new Set([...Object.keys(expected), ...Object.keys(results)])) {
            const result = results[job]?.result;
            const passed = Object.hasOwn(expected, job) &&
              (result === 'success' || (result === 'skipped' && expected[job] === false));
            console.log(`${job}: ${result || 'missing'}${passed ? '' : ' (required check failed)'}`);
            failed ||= !passed;
          }
          for (const [job, skipped] of Object.entries(JSON.parse(process.env.CI_FORK_SKIPPED))) {
            if (skipped) {
              console.log(`::warning title=Skipped for fork PR::${job} needs the private WooCommerce Bookings download, which fork PRs cannot access. Run it from a branch in this repository before merging.`);
            }
          }
          if (process.env.CI_DRAFT === 'true') {
            console.log('::error::Draft PR: PHP unit and integration tests, Plugin Check, the package build and E2E tests run once the PR is ready for review.');
            failed = true;
          }
          process.exitCode = failed ? 1 : 0;
          NODE
