name: Pull Request CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

    # Change detection, lint, PHPStan, PHPUnit, the production ZIP, Plugin Check and E2E, each
    # gated on config.woo and on the files that changed (.github/paths-filter.yml and
    # .github/product-filter.yml). Its `Check results` job fails when an applicable check did
    # not pass, and on drafts.
    ci:
      name: CI
      permissions:
        contents: read
        actions: read
        checks: write
        pull-requests: read
      uses: woocommerce/.github/.github/workflows/plugin-pr-ci.yml@0f986df9f4bfb68803757855a7f3ab361bc56ed3 # trunk @ 2026-11-16
      secrets:
        ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    # The single status that branch protection requires. It passes only when the shared
    # workflow succeeded, so a failed, cancelled or draft-era run never satisfies it.
    required:
      name: Required checks
      if: ${{ always() }}
      needs: ci
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions: {}
      env:
        CI_RESULT: ${{ needs.ci.result }}
      steps:
        - name: Check the CI result
          run: |
            echo "CI: $CI_RESULT"
            if [[ "$CI_RESULT" != 'success' ]]; then
              echo "::error::CI did not pass ($CI_RESULT). Its CI / Check results job lists each check."
              exit 1
            fi
