name: Pull Request CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

    # Change detection, lint, PHPStan, PHPUnit, the production ZIP, Plugin Check and E2E, each
    # gated on config.woo and on the files that changed (.github/paths-filter.yml and
    # .github/product-filter.yml). Its `Check results` job fails when an applicable check did
    # not pass, and on drafts.
    ci:
      name: CI
      permissions:
        contents: read
        actions: read
        pull-requests: read
      uses: woocommerce/.github/.github/workflows/plugin-pr-ci.yml@11ae4c883ff955b4a4181bac17214e4fd2545547 # shared @ 2026-11-16
      secrets:
        ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    # Reserve both required check names for trunk so GitHub cannot reuse a result
    # from another base when a pull request is retargeted.
    version-check:
      name: ${{ github.base_ref == 'trunk' && 'Validate @version Tag' || 'Validate @version Tag (non-trunk)' }}
      if: ${{ github.base_ref == 'trunk' }}
      runs-on: ubuntu-latest
      timeout-minutes: 5
      steps:
        # Release bumps replace 'x.x.x' with the real version by design. Skip
        # the step so the currently required job still reports its check name.
        - uses: woocommerce/.github/actions/check-version@11ae4c883ff955b4a4181bac17214e4fd2545547 # shared @ 2026-11-16
          if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/')) }}

    # Require both shared CI and version validation when applicable.
    required:
      name: ${{ github.base_ref == 'trunk' && 'Required checks' || 'Required checks (non-trunk)' }}
      if: ${{ always() }}
      needs: [ci, version-check]
      runs-on: ubuntu-latest
      timeout-minutes: 5
      permissions: {}
      env:
        CI_RESULT: ${{ needs.ci.result }}
      steps:
        - name: Check the CI result
          run: |
            echo "CI: $CI_RESULT"
            if [[ "$CI_RESULT" != 'success' ]]; then
              echo "::error::CI did not pass ($CI_RESULT). Its CI / Check results job lists each check."
              exit 1
            fi
        - name: Check the version validation result
          env:
            VERSION_RESULT: ${{ needs.version-check.result }}
          run: |
            echo "Version validation: $VERSION_RESULT"
            if [[ "$VERSION_RESULT" != 'success' && "$VERSION_RESULT" != 'skipped' ]]; then
              echo "::error::Version validation did not pass ($VERSION_RESULT). See the Validate @version Tag job."
              exit 1
            fi
