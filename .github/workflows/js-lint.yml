name: JavaScript Lint

on:
  workflow_call:
    inputs:
      frontend:
        description: Run the JavaScript and package checks.
        type: boolean
        default: true
      docs:
        description: Run the Markdown check.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check authored JavaScript
        if: ${{ inputs.frontend }}
        run: npm run lint:js

      - name: Check dependency licenses
        if: ${{ !cancelled() && inputs.frontend }}
        run: npm run check-licenses

      - name: Check package metadata
        if: ${{ !cancelled() && inputs.frontend }}
        run: npm run lint:pkg-json

      - name: Check Markdown documentation
        if: ${{ !cancelled() && inputs.docs }}
        run: npm run lint:md:docs
