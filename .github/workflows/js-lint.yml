name: JavaScript Lint

on:
  workflow_call:
    inputs:
      frontend:
        description: Run the JavaScript and package checks.
        type: boolean
        default: true
      docs:
        description: Run the Markdown check.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Verify Ubuntu 26.04 runner
        shell: bash
        run: |
          . /etc/os-release
          printf "Runner OS: %s %s\n" "$ID" "$VERSION_ID"
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check authored JavaScript
        if: ${{ inputs.frontend }}
        run: npm run lint:js

      - name: Check dependency licenses
        if: ${{ !cancelled() && inputs.frontend }}
        run: npm run check-licenses

      - name: Check package metadata
        if: ${{ !cancelled() && inputs.frontend }}
        run: npm run lint:pkg-json

      - name: Check Markdown documentation
        if: ${{ !cancelled() && inputs.docs }}
        run: npm run lint:md:docs
