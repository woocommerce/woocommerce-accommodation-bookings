name: Cron CI

on:
  schedule:
    # Run at 01:00 on Monday.
    - cron: '0 1 * * 1'
  # The same run on demand, for example to check a workflow change on its branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:

    # Lint, PHPStan, PHPUnit and the integration suite on the scheduled versions, the production
    # ZIP, Plugin Check, E2E, QIT on the stable versions and the dependency advisory check.
    cron:
        name: Cron
        permissions:
          contents: read
          actions: read
          checks: write
          pull-requests: read
          vulnerability-alerts: read
        uses: woocommerce/.github/.github/workflows/plugin-cron-ci.yml@0f986df9f4bfb68803757855a7f3ab361bc56ed3 # trunk @ 2026-11-16
        secrets:
          ORG_DOWNLOADS: ${{ secrets.ORG_DOWNLOADS }}
          ORG_PARTNER_USER: ${{ secrets.ORG_PARTNER_USER }}
          ORG_PARTNER_SECRET: ${{ secrets.ORG_PARTNER_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
