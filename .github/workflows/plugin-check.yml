name: 'WordPress Plugin Checks'
on:
  push:
    branches:
    - trunk
    - develop

  pull_request:
    branches:
      - trunk
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Run plugin check
      uses: wordpress/plugin-check-action@6f5a57e173c065a394b78688f75df543e4011902 # v1.1.5
      with:
        exclude-checks: |
          plugin_readme
          plugin_updater
          file_type
          trademarks
          direct_db_queries
          performant_wp_query_params
          enqueued_scripts_in_footer
          plugin_header_text_domain

        exclude-directories: |
          .github
          node_modules
          vendor
          tests
          bin
          build
          assets

        ignore-warnings: true

        ignore-codes: |
          WordPress.DateTime.RestrictedFunctions.date_date
