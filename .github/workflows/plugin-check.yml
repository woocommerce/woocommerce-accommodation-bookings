name: 'WordPress Plugin Checks'
on:
  push:
    branches:
    - trunk
    - develop

  workflow_call:
    inputs:
      release-artifact:
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      if: inputs.release-artifact == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download the release archive
      if: inputs.release-artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.release-artifact }}
        path: release-package

    - name: Unpack the release archive
      if: inputs.release-artifact != ''
      id: archive
      run: |
        unzip -q "release-package/${GITHUB_REPOSITORY#*/}.zip" -d release-build
        shopt -s dotglob nullglob
        entries=(release-build/*)
        if [[ ${#entries[@]} != 1 || ! -d "${entries[0]}" ]]; then
          echo "::error::The release ZIP must contain one plugin directory."
          exit 1
        fi
        echo "plugin_dir=${entries[0]}" >> "$GITHUB_OUTPUT"

    - name: Run plugin check
      uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
      with:
        build-dir: ${{ steps.archive.outputs.plugin_dir || './' }}
        # Keep results in annotations and artifacts.
        repo-token: ''
        # Enforce warnings; ignore only reviewed codes below.
        ignore-warnings: false
        strict: true

        exclude-directories: |
          .github
          node_modules
          vendor
          tests
          bin
          build
          assets
          tools
          changelog

        # Development configuration and documentation.
        exclude-files: |
          .git
          .gitignore
          .gitattributes
          .nvmrc
          .wp-env.json
          .wp-env.test.json
          .stylelintrc.json
          .markdownlintignore
          .npmpackagejsonlintrc.json
          .prettierrc.js
          .coderabbit.yaml
          phpcs.xml.dist
          phpcs-compat.xml.dist
          phpstan.neon.dist
          phpstan-baseline.neon
          phpstan-bootstrap.php
          AGENTS.md
          CLAUDE.md
          DEVELOPER.md

        # Existing metadata, WooCommerce contracts and reviewed legacy debt.
        # These codes also suppress future occurrences; review before extending.
        ignore-codes: |
          WordPress.DB.DirectDatabaseQuery.DirectQuery
          WordPress.DB.DirectDatabaseQuery.NoCaching
          WordPress.DateTime.RestrictedFunctions.date_date
          WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedClassFound
          WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedConstantFound
          WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound
          WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedVariableFound
          WordPress.Security.ValidatedSanitizedInput.InputNotSanitized
          plugin_header_nonexistent_domain_path
          trademarked_term
