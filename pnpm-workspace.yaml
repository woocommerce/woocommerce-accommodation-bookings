nodeLinker: hoisted

overrides:
  "minimatch@>=7 <11.0.8": "11.0.8"
  "glob@>=9 <14.0.6": "14.0.6"
  "@wp-playground/storage>isomorphic-git": "1.44.11"
  "fast-xml-parser": "5.12.0"
  "serialize-javascript": "^7.1.3"
  "markdownlint-cli": "0.49.1"
  "markdownlint-cli>js-yaml": "5.4.2"
  "qs": "6.16.1"
  "uuid@8": "11.1.1"
  "postcss-selector-parser": "7.1.6"
  "smol-toml": "1.9.0"
  "katex": "0.18.2"

# Let new releases age 24 hours before installing (same as the WooCommerce monorepo).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@automattic/*"
  - "@woocommerce/*"
  - "@wordpress/*"
